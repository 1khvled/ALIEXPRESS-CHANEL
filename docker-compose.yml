services:
  app:
    build: .
    container_name: aliexpress_deals_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./sessions:/app/sessions
      - ./deals.db:/app/deals.db
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    container_name: aliexpress_deals_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deals
      POSTGRES_USER: deals_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deals_user -d deals"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres_data:
