name: Tajmi3at & Category Fahras Publisher

on:
  # Automated schedule disabled per user requirement: post single deals only, no tajmi3at compilations
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to publish (all, phones, headsets, pc_parts, chargers)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - phones
          - headsets
          - pc_parts
          - chargers

concurrency:
  group: tajmi3at-publisher
  cancel-in-progress: false

jobs:
  publish-fahras:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-aliexpress-api

      - name: Run Fahras Publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID || '@DzAliexpress0' }}
        run: |
          python scripts/publish_all_fahras.py --category "${{ github.event.inputs.category || 'all' }}"

      - name: Commit and push DB changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add storage/state/ deals.db || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update state after Tajmi3at publication [skip ci] [skip vercel] [vercel skip]"
            for i in 1 2 3 4 5; do
              git fetch origin main || true
              git rebase -X ours origin/main || (git rebase --abort && git pull origin main --no-rebase -X ours) || true
              git push origin main && break || sleep 5
            done
          fi
        continue-on-error: true
