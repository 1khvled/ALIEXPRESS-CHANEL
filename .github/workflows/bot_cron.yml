name: AliExpress Deals Telegram Bot

on:
  schedule:
    # Daytime (07:00 - 00:59 DZ / 06:00 - 23:59 UTC): Every 5 minutes
    - cron: '*/5 6-23 * * *'
    # Nighttime (01:00 - 06:59 DZ / 00:00 - 05:59 UTC): Every 30 minutes
    - cron: '*/30 0-5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
    inputs:
      force:
        description: 'Force post deals immediately bypassing cooldown'
        required: false
        type: boolean
        default: false
      test_alert:
        description: 'Send a test admin alert DM only (verifies notifiers end-to-end)'
        required: false
        type: boolean
        default: false

concurrency:
  group: telegram-deals-cron
  cancel-in-progress: true

jobs:
  run-deals-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-aliexpress-api

      - name: Run Algeria Deals Publisher (@DzAliexpress0)
        id: algeria
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID || '@DzAliexpress0' }}
          FRANCE_TARGET_CHANNEL_ID: ${{ secrets.FRANCE_TARGET_CHANNEL_ID || '@francedealsdz' }}
          ALIEXPRESS_AFFILIATE_PROVIDER: portals
          ALIEXPRESS_AFFILIATE_TRACKING_ID: ${{ secrets.ALIEXPRESS_AFFILIATE_TRACKING_ID || 'dzkhvled16' }}
          ALIEXPRESS_AFFILIATE_APP_KEY: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_KEY }}
          ALIEXPRESS_AFFILIATE_APP_SECRET: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_SECRET }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite+aiosqlite:///deals.db' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_AUTO_POST_ENABLED: ${{ secrets.FACEBOOK_AUTO_POST_ENABLED || 'true' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/post_recent_deals.py --force
          else
            python scripts/post_recent_deals.py
          fi

      - name: Run France Deals Publisher (@francedealsdz)
        id: france
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          FRANCE_TARGET_CHANNEL_ID: ${{ secrets.FRANCE_TARGET_CHANNEL_ID || '@francedealsdz' }}
          ALIEXPRESS_AFFILIATE_PROVIDER: portals
          ALIEXPRESS_AFFILIATE_TRACKING_ID: ${{ secrets.ALIEXPRESS_AFFILIATE_TRACKING_ID || 'dzkhvled16' }}
          ALIEXPRESS_AFFILIATE_APP_KEY: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_KEY }}
          ALIEXPRESS_AFFILIATE_APP_SECRET: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_SECRET }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite+aiosqlite:///deals.db' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/post_france_deals.py --force
          else
            python scripts/post_france_deals.py
          fi

      - name: Send test admin alert (manual verification)
        # One-click end-to-end proof that admin DMs work. Trigger via
        # Actions -> Run workflow -> test_alert: true. Fails loudly if the
        # secrets are wrong; success means Telegram returned ok:true.
        if: github.event.inputs.test_alert == 'true'
        env:
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: |
          if [ -z "$ADMIN_BOT_TOKEN" ] || [ -z "$ADMIN_USER_ID" ]; then
            echo "Admin alert test FAILED: ADMIN_BOT_TOKEN or ADMIN_USER_ID not configured."
            exit 1
          fi
          MSG=$(printf 'Test admin alert OK\nRepo: %s\nRun: #%s\nTime: %s' \
            "${{ github.repository }}" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          RESP=$(curl -s -X POST "https://api.telegram.org/bot$ADMIN_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$ADMIN_USER_ID" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "disable_web_page_preview=true")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "Telegram API did not return ok:true"; exit 1; }

      - name: Notify admin on publisher failure
        # Catches what in-process alerts cannot: import-time crashes, missing deps, or any nonzero exit.
        if: always() && (steps.algeria.outcome == 'failure' || steps.france.outcome == 'failure' || failure())
        env:
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: |
          if [ -z "$ADMIN_BOT_TOKEN" ] || [ -z "$ADMIN_USER_ID" ]; then
            echo "Admin alert skipped: ADMIN_BOT_TOKEN or ADMIN_USER_ID not configured."
            exit 0
          fi
          FAILED=""
          [ "${{ steps.algeria.outcome }}" = "failure" ] && FAILED="Algeria publisher (@DzAliexpress0)"
          [ "${{ steps.france.outcome }}" = "failure" ] && FAILED="$FAILED France publisher (@francedealsdz)"
          MSG=$(printf '⚠️ Bot Alert: publisher step failed\nRepo: %s\nRun: #%s (%s)\nSHA: %s\nFailed: %s\nLogs: https://github.com/%s/actions/runs/%s' \
            "${{ github.repository }}" "${{ github.run_number }}" "${{ github.event_name }}" "${{ github.sha }}" "$FAILED" \
            "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot$ADMIN_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$ADMIN_USER_ID" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" || true

      - name: Commit and push DB changes (if using local SQLite)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add storage/state/ deals.db storage/ || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update deals database [skip ci] [skip vercel] [vercel skip]"
            for i in 1 2 3 4 5; do
              git fetch origin main || true
              git rebase -X ours origin/main || (git rebase --abort && git pull origin main --no-rebase -X ours) || true
              git push origin main && break || sleep 5
            done
          fi
        continue-on-error: true
