name: AliExpress Deals Telegram Bot

on:
  schedule:
    # Run every 5 minutes 24/7 autonomously (day/night cadence handled by Python state tracker)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
    inputs:
      force:
        description: 'Force post deals immediately bypassing cooldown'
        required: false
        type: boolean
        default: false

jobs:
  run-deals-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-aliexpress-api

      - name: Run Algeria Deals Publisher (@DzAliexpress0)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8900887118:AAELbFHyV2joUO-4EJ0fPSoZurkQNuENbfY' }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID || '@DzAliexpress0' }}
          ALIEXPRESS_AFFILIATE_PROVIDER: portals
          ALIEXPRESS_AFFILIATE_TRACKING_ID: ${{ secrets.ALIEXPRESS_AFFILIATE_TRACKING_ID || 'dzkhvled16' }}
          ALIEXPRESS_AFFILIATE_APP_KEY: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_KEY || '538348' }}
          ALIEXPRESS_AFFILIATE_APP_SECRET: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_SECRET || '7z5QlJZAxNka2zBrgzCWrUNusBXJGHYx' }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID || '5625295907' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite+aiosqlite:///deals.db' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/post_recent_deals.py --force
          else
            python scripts/post_recent_deals.py
          fi

      - name: Run France Deals Publisher (@francedealsdz)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8900887118:AAELbFHyV2joUO-4EJ0fPSoZurkQNuENbfY' }}
          FRANCE_TARGET_CHANNEL_ID: ${{ secrets.FRANCE_TARGET_CHANNEL_ID || '@francedealsdz' }}
          ALIEXPRESS_AFFILIATE_PROVIDER: portals
          ALIEXPRESS_AFFILIATE_TRACKING_ID: ${{ secrets.ALIEXPRESS_AFFILIATE_TRACKING_ID || 'dzkhvled16' }}
          ALIEXPRESS_AFFILIATE_APP_KEY: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_KEY || '538348' }}
          ALIEXPRESS_AFFILIATE_APP_SECRET: ${{ secrets.ALIEXPRESS_AFFILIATE_APP_SECRET || '7z5QlJZAxNka2zBrgzCWrUNusBXJGHYx' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/post_france_deals.py --force
          else
            python scripts/post_france_deals.py
          fi
        continue-on-error: true

      - name: Commit and push DB changes (if using local SQLite)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add storage/state/ deals.db storage/ || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update deals database [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git push && break || sleep 3
            done
          fi
        continue-on-error: true
